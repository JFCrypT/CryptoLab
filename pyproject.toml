[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "cryptolab"
version = "1.1.0"
description = "A didactic laboratory for cryptographic mathematics and applied cryptography."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "José Federico Castro Tramontina" }
]
keywords = [
  "cryptography",
  "number-theory",
  "education",
  "cryptanalysis",
  "applied-cryptography",
  "post-quantum-cryptography",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=46.0.0,<50.0.0",
  "rich>=14.0.0,<15.0.0",
  "typer>=0.16.0,<1.0.0",
]

[project.scripts]
cryptolab = "cryptolab.cli.app:main"

[project.urls]
Homepage = "https://github.com/JFCrypT/CryptoLab"
Repository = "https://github.com/JFCrypT/CryptoLab"
Documentation = "https://jfcrypt.github.io/CryptoLab/"
Changelog = "https://github.com/JFCrypT/CryptoLab/blob/main/CHANGELOG.md"
Issues = "https://github.com/JFCrypT/CryptoLab/issues"
Security = "https://github.com/JFCrypT/CryptoLab/security/policy"

[dependency-groups]
dev = [
  "hypothesis>=6.138.0,<7.0.0",
  "mypy>=1.17.0,<2.0.0",
  "pre-commit>=4.2.0,<5.0.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-cov>=6.2.0,<7.0.0",
  "ruff>=0.12.0,<1.0.0",
]
docs = [
  "mkdocs>=1.6.1,<2.0.0",
  "mkdocs-material>=9.6.0,<10.0.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
module-name = "cryptolab"
module-root = "src"
source-include = [
  "docs/**",
  "mkdocs.yml",
  "CHANGELOG.md",
  "CITATION.cff",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "sagemath/**",
  "scripts/**",
  "tests/**",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C90",
  "DTZ",
  "E",
  "F",
  "FA",
  "FBT",
  "FURB",
  "I",
  "ICN",
  "INP",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "PLR0913",
  "S101",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"src/cryptolab/cli/**/*.py" = ["FBT", "PLR0917", "TC003"]
"src/cryptolab/rendering/**/*.py" = ["TC001", "TC002"]
"tests/**/*.py" = ["ARG", "FBT", "PLR2004", "S101", "TC002", "TC003"]
"scripts/**/*.py" = ["C901", "INP001", "PLR0912", "PLR0915", "PLR2004", "T201"]
"sagemath/**/*.py" = ["INP001", "PLR2004", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
packages = ["cryptolab"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=cryptolab",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["cryptolab"]
omit = ["src/cryptolab/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
