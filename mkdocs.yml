site_name: CryptoLab — Applied Cryptography Laboratory
site_description: Didactic laboratory for cryptographic mathematics and applied cryptography.
repo_url: https://github.com/JFCrypT/CryptoLab
repo_name: JFCrypT/CryptoLab
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Foundations:
      - Cryptographic foundations: foundations/cryptographic-foundations.md
      - Implementation categories: foundations/implementation-categories.md
      - Validation model: foundations/validation-model.md
  - Mathematics:
      - Integer arithmetic: mathematics/integer-arithmetic.md
      - Linear Diophantine equations: mathematics/diophantine-equations.md
      - Modular arithmetic: mathematics/modular-arithmetic.md
      - Algebraic structures: mathematics/algebraic-structures.md
  - Classical cryptography:
      - Configurable alphabets: classical/alphabets.md
      - Caesar cipher: classical/caesar.md
      - Vigenère cipher: classical/vigenere.md
      - Polybius square: classical/polybius.md
  - Symmetric cryptography:
      - XOR, Vernam, and One-Time Pad: symmetric/xor-vernam-otp.md
      - AES and its modes: symmetric/aes.md
      - ChaCha20-Poly1305: symmetric/chacha20-poly1305.md
      - Modern symmetric comparisons: symmetric/modern-comparisons.md
  - Hashing, authentication, and derivation:
      - SHA-256 and SHA3-256: hashing/sha2-sha3.md
      - HMAC-SHA-256: hashing/hmac.md
      - HKDF-SHA-256: hashing/hkdf.md
  - Public-key cryptography:
      - Educational textbook RSA: public-key/educational-rsa.md
      - Applied RSA-OAEP and RSA-PSS: public-key/applied-rsa.md
      - RSA construction comparison: public-key/rsa-comparisons.md
      - Educational finite-field Diffie-Hellman: public-key/finite-field-diffie-hellman.md
      - Educational elliptic curves: public-key/educational-elliptic-curves.md
      - X25519 key agreement: public-key/x25519.md
      - Ed25519 digital signatures: public-key/ed25519.md
      - Modern curve comparisons: public-key/modern-curve-comparisons.md
  - Pseudorandom sequences:
      - Linear Feedback Shift Registers: sequences/lfsr.md
      - Elementary sequence analysis: sequences/analysis.md
  - Required comparisons: comparisons/required-comparisons.md
  - Validation and release:
      - Release traceability: validation/release-traceability.md
      - Release acceptance: validation/release-acceptance.md
      - Optional SageMath cross-validation: validation/sagemath-cross-validation.md
      - Release process: release-process.md
  - Controlled laboratories:
      - Caesar brute force: laboratories/caesar-brute-force.md
      - Vernam key reuse: laboratories/vernam-key-reuse.md
      - ECB pattern leakage: laboratories/ecb-pattern-leakage.md
      - Diffie-Hellman man-in-the-middle: laboratories/dh-man-in-the-middle.md
  - Architecture decisions:
      - Foundational architecture: decisions/0001-foundational-architecture.md
      - Mathematical conventions: decisions/0002-mathematical-conventions.md
      - Diophantine and modular conventions: decisions/0003-diophantine-and-modular-conventions.md
      - Algebra and classical conventions: decisions/0004-algebra-and-classical-conventions.md
      - XOR, Vernam, LFSR, and laboratory conventions: decisions/0005-xor-vernam-lfsr-and-laboratory-conventions.md
      - Modern symmetric conventions: decisions/0006-modern-symmetric-conventions.md
      - Hashing, HMAC, and HKDF conventions: decisions/0007-hashing-hmac-hkdf-conventions.md
      - RSA conventions: decisions/0008-rsa-conventions.md
      - Finite-field DH and MITM conventions: decisions/0009-finite-field-dh-and-mitm-conventions.md
      - Elliptic curves, X25519, and Ed25519 conventions: decisions/0010-elliptic-curves-x25519-ed25519-conventions.md
      - Release hardening and cross-validation: decisions/0011-release-hardening-and-cross-validation.md
  - Release status and future scope: roadmap.md
  - References: references.md
