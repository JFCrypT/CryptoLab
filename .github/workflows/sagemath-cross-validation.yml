name: Optional SageMath Cross-Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - name: Synchronize dependencies
        run: uv sync --frozen
      - name: Pull pinned SageMath image
        run: docker pull sagemath/sagemath:10.8
      - name: Create SageMath container wrapper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sage" <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm -i \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            sagemath/sagemath:10.8 \
            sage "$@"
          EOF
          chmod +x "$RUNNER_TEMP/sage"
      - name: Confirm reference calculator
        run: test -f sagemath/compute_reference.py
      - name: Cross-validate representative educational calculations
        shell: bash
        run: |
          SAGE="$RUNNER_TEMP/sage"
          uv run python scripts/cross_validate.py --sage-executable "$SAGE" -- integer gcd 250 110
          uv run python scripts/cross_validate.py --sage-executable "$SAGE" -- modular inverse 13 200
          uv run python scripts/cross_validate.py --sage-executable "$SAGE" -- \
            modular crt \
            --congruence 5:7 \
            --congruence 0:6 \
            --congruence=-1:5
          uv run python scripts/cross_validate.py --sage-executable "$SAGE" -- \
            public-key rsa educational inspect 61 53 17
          uv run python scripts/cross_validate.py --sage-executable "$SAGE" -- \
            public-key ecc multiply 17 2 2 3 5:1
